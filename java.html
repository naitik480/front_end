<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Manager - Save & Retrieve JSON</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f7f9;
    }
    .container {
      max-width: 1000px;
      margin: auto;
    }
    h1 { text-align: center; color: #333; }
    
    .form-container {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    
    button {
      padding: 12px 20px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    
    .btn-save { background: #28a745; color: white; }
    .btn-clear { background: #dc3545; color: white; }
    .btn-view { background: #007bff; color: white; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background: #343a40;
      color: white;
    }
    .delete-btn {
      background: #dc3545;
      color: white;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Data Manager (JSON Storage)</h1>

    <!-- Form -->
    <div class="form-container">
      <h2>Submit New Record</h2>
      <form id="dataForm">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="tel" id="phone" placeholder="Phone Number" required>
        <input type="number" id="age" placeholder="Age" required>
        
        <select id="course" required>
          <option value="">Select Course</option>
          <option value="Computer Science">Computer Science</option>
          <option value="Information Technology">Information Technology</option>
          <option value="Data Science">Data Science</option>
          <option value="Cyber Security">Cyber Security</option>
          <option value="AI & ML">AI & Machine Learning</option>
        </select>

        <button type="submit" class="btn-save">Save Record</button>
        <button type="button" class="btn-clear" onclick="clearAllData()">Clear All Data</button>
      </form>
    </div>

    <!-- Display Section -->
    <div>
      <h2>Saved Records <button onclick="loadData()" class="btn-view">Refresh</button></h2>
      <table id="dataTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Age</th>
            <th>Course</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    // Load data on page load
    window.onload = () => loadData();

    // Handle form submission
    document.getElementById('dataForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const record = {
        id: Date.now(), // Unique ID
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        age: document.getElementById('age').value,
        course: document.getElementById('course').value,
        date: new Date().toLocaleString()
      };

      // Get existing data or initialize empty array
      let records = JSON.parse(localStorage.getItem('records')) || [];
      records.push(record);

      // Save as JSON string in localStorage
      localStorage.setItem('records', JSON.stringify(records));

      alert('Record saved successfully!');
      this.reset(); // Clear form
      loadData();   // Refresh table
    });

    // Load and display data
    function loadData() {
      const records = JSON.parse(localStorage.getItem('records')) || [];
      const tbody = document.querySelector('#dataTable tbody');
      tbody.innerHTML = '';

      if (records.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">No records found</td></tr>`;
        return;
      }

      records.forEach((record, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${record.id}</td>
          <td>${record.name}</td>
          <td>${record.email}</td>
          <td>${record.phone}</td>
          <td>${record.age}</td>
          <td>${record.course}</td>
          <td><button class="delete-btn" onclick="deleteRecord(${index})">Delete</button></td>
        `;
        tbody.appendChild(row);
      });
    }

    // Delete single record
    function deleteRecord(index) {
      if (confirm('Are you sure you want to delete this record?')) {
        let records = JSON.parse(localStorage.getItem('records')) || [];
        records.splice(index, 1);
        localStorage.setItem('records', JSON.stringify(records));
        loadData();
      }
    }

    // Clear all data
    function clearAllData() {
      if (confirm('Warning: This will delete ALL records permanently!')) {
        localStorage.removeItem('records');
        loadData();
      }
    }
  </script>

</body>
</html>
