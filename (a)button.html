<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
       button{

        text-align:center;
        font-size:  44px;
        font-weight: 200;
        float: left;
       
    }
    
  </style>
<body>
    
    <button id="a" onclick="showmessage()">show message</button>
    
    
    <script>
        function showmessage(){
            document.getElementById("a").innerHTML = "Hello World! ";
        }
    </script>
</body>
</html>
