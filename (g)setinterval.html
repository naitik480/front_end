<body>

<h1>Timer/counter</h1>

<p id="counter">0</p>

<script>
let myInterval;
let count = 0;

  myInterval = setInterval(counter, 2000);

function counter() {
  count++;
  document.getElementById("counter").innerHTML = count;
}
