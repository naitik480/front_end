<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style> 

body{
    text-align: center;
    background-color: beige;
}

#div1 {

  border-radius: 25px;
  background-color: #04AA6D;
  padding: 20px; 
  width: 200px;
  height: 150px;  
}
#div2 {
 float:left;
}
.button {

  border: none;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
}
.button1 {background-color: #f44336;
 
}
.button2 {background-color: #008CBA;
}

</style>

</head>
<body>
   
    <div id="div1">
 
        <input type="text"  id="c" placeholder="enter celcius" >
    <input type="text"  id="f" placeholder="enter farenheit" >

</div>
    
<div id="div2">

    <button class="button button1" onclick="celciustof()">Farenheit</button>
    <button class="button button2"onclick="farenheitoc()">celcius</button>
    

</div>
   
   <script>
       function celciustof(){
       let x=document.getElementById('c');
      let y=document.getElementById('f');
      
       console.log(x.value);
    y.value=(x.value*9/5)+32;
    
    }

function farenheitoc(){
       let y=document.getElementById('f');
      let x=document.getElementById('c');
      
       console.log(y.value);
    x.value=(y.value-32)*5/9;
    
    }

</script>


   

</body>
</html>
